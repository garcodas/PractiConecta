syntax = "proto3";
package practiconecta.notifications;

import "common.proto";

message Notification {
  string id = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  string link = 5;
  string read_at = 6;
  string created_at = 7;
}

message ListNotificationsRequest {
  practiconecta.common.Actor actor = 1;
  int32 page = 2;
}

message NotificationPage {
  repeated Notification items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UnreadCount {
  int32 count = 1;
}

message MarkReadRequest {
  practiconecta.common.Actor actor = 1;
  string notification_id = 2;
}

service NotificationsService {
  rpc List(ListNotificationsRequest) returns (NotificationPage);
  rpc GetUnreadCount(practiconecta.common.ActorRequest) returns (UnreadCount);
  rpc MarkRead(MarkReadRequest) returns (Notification);
  rpc MarkAllRead(practiconecta.common.ActorRequest) returns (UnreadCount);
}
