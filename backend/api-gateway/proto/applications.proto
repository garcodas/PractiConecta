syntax = "proto3";
package practiconecta.applications;

import "common.proto";

message Application {
  string id = 1;
  string offer_id = 2;
  string student_id = 3;
  string company_id = 4;
  string offer_title = 5;
  string company_name = 6;
  string status = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated string allowed_transitions = 10;
}

message ApplicationList {
  repeated Application items = 1;
}

message StatusChange {
  string from_status = 1;
  string to_status = 2;
  string changed_at = 3;
}

message ApplicationDetail {
  Application application = 1;
  repeated StatusChange history = 2;
}

message OfferScopedRequest {
  practiconecta.common.Actor actor = 1;
  string offer_id = 2;
}

message ApplicationIdRequest {
  practiconecta.common.Actor actor = 1;
  string application_id = 2;
}

message ChangeStatusRequest {
  practiconecta.common.Actor actor = 1;
  string application_id = 2;
  string to_status = 3;
}

message FindMineResponse {
  bool found = 1;
  Application application = 2;
}

message CountByOffersRequest {
  practiconecta.common.Actor actor = 1;
  repeated string offer_ids = 2;
}

message OfferCount {
  string offer_id = 1;
  int32 count = 2;
}

message OfferCountList {
  repeated OfferCount items = 1;
}

service ApplicationsService {
  rpc Submit(OfferScopedRequest) returns (Application);
  rpc ListMine(practiconecta.common.ActorRequest) returns (ApplicationList);
  rpc GetMine(ApplicationIdRequest) returns (ApplicationDetail);
  rpc FindMineByOffer(OfferScopedRequest) returns (FindMineResponse);
  rpc ListByOffer(OfferScopedRequest) returns (ApplicationList);
  rpc ChangeStatus(ChangeStatusRequest) returns (Application);
  rpc CountByOffers(CountByOffersRequest) returns (OfferCountList);
}
