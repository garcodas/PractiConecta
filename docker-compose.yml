name: practiconecta

x-service: &service
  init: true
  restart: unless-stopped

x-grpc-health: &grpc-health
  interval: 2s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d notifications_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  identity-migrate:
    image: practiconecta-identity-service:1.0
    command: ["sh", "-c", "node dist/migrate.js up && node dist/seed.js"]
    environment:
      DATABASE_URL: postgres://identity_svc:identity_pw@postgres:5432/identity_db
    depends_on:
      postgres:
        condition: service_healthy

  identity-service:
    <<: *service
    image: practiconecta-identity-service:1.0
    build: ./backend/identity-service
    environment:
      DATABASE_URL: postgres://identity_svc:identity_pw@postgres:5432/identity_db
      REDIS_URL: redis://redis:6379
      GRPC_URL: 0.0.0.0:50051
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "node", "-e", "require('net').connect(50051,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]

  offers-migrate:
    image: practiconecta-offers-service:1.0
    command: ["sh", "-c", "node dist/migrate.js up && node dist/seed.js"]
    environment:
      DATABASE_URL: postgres://offers_svc:offers_pw@postgres:5432/offers_db
      APP_TIMEZONE: America/Guatemala
    depends_on:
      postgres:
        condition: service_healthy

  offers-service:
    <<: *service
    image: practiconecta-offers-service:1.0
    build: ./backend/offers-service
    environment:
      DATABASE_URL: postgres://offers_svc:offers_pw@postgres:5432/offers_db
      REDIS_URL: redis://redis:6379
      GRPC_URL: 0.0.0.0:50052
      IDENTITY_GRPC_URL: identity-service:50051
      APP_TIMEZONE: America/Guatemala
    depends_on:
      offers-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "node", "-e", "require('net').connect(50052,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]

  applications-migrate:
    image: practiconecta-applications-service:1.0
    command: ["node", "dist/migrate.js", "up"]
    environment:
      DATABASE_URL: postgres://applications_svc:applications_pw@postgres:5432/applications_db
    depends_on:
      postgres:
        condition: service_healthy

  applications-service:
    <<: *service
    image: practiconecta-applications-service:1.0
    build: ./backend/applications-service
    environment:
      DATABASE_URL: postgres://applications_svc:applications_pw@postgres:5432/applications_db
      REDIS_URL: redis://redis:6379
      GRPC_URL: 0.0.0.0:50053
      OFFERS_GRPC_URL: offers-service:50052
      APP_TIMEZONE: America/Guatemala
    depends_on:
      applications-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "node", "-e", "require('net').connect(50053,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]

  notifications-migrate:
    image: practiconecta-notifications-service:1.0
    command: ["node", "dist/migrate.js", "up"]
    environment:
      DATABASE_URL: postgres://notifications_svc:notifications_pw@postgres:5432/notifications_db
    depends_on:
      postgres:
        condition: service_healthy

  notifications-service:
    <<: *service
    image: practiconecta-notifications-service:1.0
    build: ./backend/notifications-service
    environment:
      DATABASE_URL: postgres://notifications_svc:notifications_pw@postgres:5432/notifications_db
      REDIS_URL: redis://redis:6379
      GRPC_URL: 0.0.0.0:50054
      IDENTITY_GRPC_URL: identity-service:50051
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "node", "-e", "require('net').connect(50054,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]

  api-gateway:
    <<: *service
    image: practiconecta-api-gateway:1.0
    build: ./backend/api-gateway
    environment:
      PORT: "4000"
      # Secreto solo para la demostración local.
      JWT_SECRET: practiconecta-demo-secret-no-usar-en-produccion
      IDENTITY_GRPC_URL: identity-service:50051
      OFFERS_GRPC_URL: offers-service:50052
      APPLICATIONS_GRPC_URL: applications-service:50053
      NOTIFICATIONS_GRPC_URL: notifications-service:50054
    ports:
      - "4000:4000"
    depends_on:
      identity-service:
        condition: service_healthy
      offers-service:
        condition: service_healthy
      applications-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  web:
    image: practiconecta-web:1.0
    init: true
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        GATEWAY_URL: http://api-gateway:4000
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      <<: *grpc-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

volumes:
  postgres-data:
  redis-data:
